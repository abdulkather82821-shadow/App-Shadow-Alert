name: Build & Test Shadow Alert APK

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon

      - name: Report Lint Failure Details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
            BODY=$(head -c 60000 app/build/reports/lint-results-debug.txt)
            jq -n --arg body "$BODY" '{body: ("```text\n" + $body + "\n```")}' > /tmp/lint_comment.json
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/lint_comment.json
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadow-alert-debug-apk
          path: app/build/outputs/apk/debug/*.apk
