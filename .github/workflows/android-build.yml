name: Build & Test Shadow Alert APK

on:
  push:
    branches: [ main, "arena/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.8"

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Direct Download APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Shadow-Alert.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Shadow-Alert-v1.0.0-debug.apk
          ls -lh dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadow-alert-debug-apk
          path: dist/*.apk

      - name: Publish Direct Download APK Release
        if: |
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/arena/cea42ba7-app-shadow-alert'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            cp dist/Shadow-Alert.apk "dist/Shadow-Alert-${TAG}-debug.apk"
          fi
          cat <<'EOF' > /tmp/release-notes.md
          Direct installable Android APK for **Shadow Alert** (`com.shadowalert.app.debug`, Android 8.0+ / API 26+).

          ### Direct Download
          - Tap **Shadow-Alert.apk** below to download and install directly on an Android device (enable *Install unknown apps* if prompted).
          - Built automatically after passing unit tests (`testDebugUnitTest`) and Android Lint (`lintDebug`).
          EOF
          sed -i 's/^          //' /tmp/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --target "${{ github.sha }}" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$TAG" dist/*.apk \
              --target "${{ github.sha }}" \
              --title "Shadow Alert ${TAG}" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
